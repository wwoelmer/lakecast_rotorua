name: Test Dropbox Token

on:
  workflow_dispatch:  # Allows manual run

jobs:
  test-token:
    runs-on: ubuntu-latest
    steps:
      # Checkout repo
      - uses: actions/checkout@v4

      # Set up R
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.3.1"

      # Decode token secret
      - name: Decode Dropbox token
        run: |
          echo "${{ secrets.DROPBOX_APP_TOKEN }}" | base64 --decode > token.rds

      # Test reading the token
      - name: Test token
        run: |
          Rscript -e "token <- readRDS('token.rds'); print(class(token)); print(names(token))"
