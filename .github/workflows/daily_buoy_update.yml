name: Daily Buoy Update

permissions:
  contents: write
  
on:
  schedule:
    - cron: "0 17 * * *"  # runs every day at 00:00 UTC
  workflow_dispatch:      # allows manual runs

jobs:
  update-data:
    runs-on: ubuntu-latest

    steps:
      # Checkout repository
      - name: Checkout repo
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      # Set up R 
      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.3.3"

      # cache packages
      - name: Cache R packages
        uses: actions/cache@v3
        with:
          path: ${{ env.R_LIBS_USER }}
          key: ${{ runner.os }}-r-packages-${{ hashFiles('DESCRIPTION') }}
          restore-keys: |
            ${{ runner.os }}-r-packages-

      # Install dependencies
      - name: Install R dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: |
            tidyverse
            github::karthik/rdrop2

      # Set up Dropbox token
      - name: Set up Dropbox token
        run: |
          echo "${{ secrets.DROPBOX_APP_TOKEN }}" | base64 --decode > token.rds

      # Run R script
      - name: Run download and processing script
        run: Rscript scripts/workflow/05_download_buoy_latest.R

      - name: Check file size
        run: du -sh data/buoy/*

      - name: Check git status
        run: git status

      - name: List downloaded files
        run: ls -lh data/buoy/
        

      # Commit and push changes
      - name: Commit and push changes
        run: |
         git config --global user.name "github-actions[bot]"
         git config --global user.email "github-actions[bot]@users.noreply.github.com"
         git add -A
         git commit -m "Daily buoy data update $(TZ='Pacific/Auckland' date +'%Y-%m-%d')" || echo "No changes to commit"
         git pull --rebase origin main
         git push
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
