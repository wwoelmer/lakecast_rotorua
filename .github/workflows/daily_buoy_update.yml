name: Daily Buoy Update

on:
  schedule:
    - cron: "0 0 * * *"  # runs every day at 00:00 UTC
  workflow_dispatch:      # allows manual runs

jobs:
  update-data:
    runs-on: ubuntu-latest

    steps:
      # Checkout repository
      - name: Checkout repo
        uses: actions/checkout@v4

      # Set up R 
      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          python-version: "4.3.1"

      # cache packages
      - name: Cache R packages
        uses: actions/cache@v3
        with:
          path: ${{ env.R_LIBS_USER }}
          key: ${{ runner.os }}-r-packages-${{ hashFiles('DESCRIPTION') }}
          restore-keys: |
            ${{ runner.os }}-r-packages-

      # Install dependencies
      - name: Install R dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: |
            any::tidyverse
            github::karthik/rdrop2

        # Decode the Dropbox token
      - name: Set up Dropbox token
        run: |
          echo "${{ secrets.DROPBOX_TOKEN_BASE64 }}" | base64 --decode > token.rds

      # Run your script
      - name: Run download and processing script
        run: Rscript scripts/workflow/05_download_buoy_latest.R

      # Commit and push changes
      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add output/*.csv
          git commit -m "Daily data update $(date +'%Y-%m-%d')" || echo "No changes to commit"
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
