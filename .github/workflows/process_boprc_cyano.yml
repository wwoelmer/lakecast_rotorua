name: Trigger processing of BOPRC cyano data when new file is added

on:
  push:
    paths:
      - "data/boprc_cyano/og_excel_files/**"   # watch everything under data/new_files/

jobs:
  run-rscript:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.3.3"

      - name: Install dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: |
            tidyverse
            readxl
 
      - name: Run processing script
        run: |
          Rscript scripts/workflow/01_process_boprc_data.R

      - name: Commit and push processed output
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          git add data/boprc_cyano/

          git diff --cached --quiet || git commit -m "Update processed BOPRC cyano dataset [skip ci]"

          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
