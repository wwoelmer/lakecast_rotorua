name: Trigger processing of BOPRC cyano data when new file is added

on:
  push:
    paths:
      - "data/boprc_cyano/og_excel_files**"   # watch everything under data/new_files/

jobs:
  run-rscript:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.3.3"

      - name: Install dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: |
            tidyverse
            readxl

      - name: Detect newly added files
        id: newfiles
        run: |
          # List all added files in the push
          ADDED_FILES=$(git diff-tree --no-commit-id --name-status -r ${{ github.sha }} | awk '$1=="A" {print $2}')
    
          if [ -n "$ADDED_FILES" ]; then
            echo "New files detected:"
            echo "$ADDED_FILES"
            echo "CHANGED_FILES<<EOF" >> $GITHUB_ENV
            echo "$ADDED_FILES" >> $GITHUB_ENV
            echo "EOF" >> $GITHUB_ENV
          else
            echo "No new files added in this push."
          fi

      - name: Run R script if new files exist
        if: env.CHANGED_FILES != ''
        run: |
          Rscript scripts/01_process_boprc_data.R

      - name: Commit and push R script output
        if: env.CHANGED_FILES != ''
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # Add any new or changed files in the boprc cyano folder
          git add data/boprc_cyano/
          
          # Commit if there are changes
          git diff --cached --quiet || git commit -m "Add processed BOPRC cyano files [skip ci]"
          
          # Push back to the default branch
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
